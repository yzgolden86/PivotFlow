<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102c2b" />
  <meta name="description" content="PivotFlow 管理控制台登录" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg?v=__VERSION__" />
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png?v=__VERSION__" />
  <link rel="manifest" href="/web/manifest.json?v=__VERSION__" />
  <title>登录 - PivotFlow</title>
  <link rel="stylesheet" href="/web/auth/login.css?v=__VERSION__" />
  <script defer src="/web/auth/session.js?v=__VERSION__"></script>
  <script defer src="/web/auth/login.js?v=__VERSION__"></script>
</head>
<body>
  <main class="login-shell">
    <section class="route-stage" aria-label="PivotFlow 智能路由">
      <div class="stage-brand">
        <img src="/web/brand-mark.svg?v=__VERSION__" alt="" />
        <strong>PivotFlow</strong>
      </div>
      <!-- 抽象网关图：左侧多个客户端汇聚到中心，右侧扇出到任意数量的上游。
           刻意不写任何厂商或协议名 —— 能接的上游是开放集合，写死几个名字
           既会过时，也把"通用网关"说小了。节点用 CSS 变量定位，
           增减只改 HTML 里的节点行，不必重算角度。 -->
      <div class="gateway-map" aria-hidden="true">
        <div class="gw-side gw-side--in">
          <span class="gw-dot" style="--i:0"></span>
          <span class="gw-dot" style="--i:1"></span>
          <span class="gw-dot" style="--i:2"></span>
          <span class="gw-dot" style="--i:3"></span>
        </div>

        <div class="gw-core">
          <span class="gw-ring gw-ring--outer"></span>
          <span class="gw-ring gw-ring--inner"></span>
          <img src="/web/brand-mark.svg?v=__VERSION__" alt="" />
        </div>

        <div class="gw-side gw-side--out">
          <span class="gw-dot" style="--i:0"></span>
          <span class="gw-dot" style="--i:1"></span>
          <span class="gw-dot" style="--i:2"></span>
          <span class="gw-dot" style="--i:3"></span>
          <span class="gw-dot" style="--i:4"></span>
          <span class="gw-dot" style="--i:5"></span>
        </div>

        <span class="gw-pulse gw-pulse--a"></span>
        <span class="gw-pulse gw-pulse--b"></span>
      </div>

      <p class="stage-caption">
        <strong>任意客户端，任意上游</strong>
        <span>统一入口 · 智能路由 · 自动故障转移</span>
      </p>
    </section>
    <section class="login-panel">
      <div class="login-card">
        <div class="login-card__brand"><img src="/web/brand-mark.svg?v=__VERSION__" alt="" /><span>PivotFlow</span></div>
        <header><h1>管理员登录</h1></header>
        <div id="error-message" class="login-error" role="alert" hidden></div>
        <form id="login-form" novalidate>
          <label for="password">管理密码</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入管理密码" required autofocus />
            <button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.4 5.5-9.5 5.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </div>
          <button class="submit-button" id="login-button" type="submit">
            <span class="submit-button__label">进入控制台</span><span class="submit-button__spinner" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
