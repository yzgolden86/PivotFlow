<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title>站点管理 - PivotFlow</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/sites.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/marked.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/purify.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/markdown-renderer.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/sites.js?v=__VERSION__"></script>
</head>
<body class="page-sites top-layout">
  <div class="app-container">
    <main class="main-content sites-main-content">
      <div class="content-area sites-content-area">

        <div class="sites-hero-bar">
          <div>
            <h1 class="sites-page-title">站点管理</h1>
            <p class="sites-page-subtitle">统一管理上游站点、账号、签到、公告与模型同步</p>
          </div>
        </div>

        <div class="sites-tab-bar" role="tablist">
          <button class="sites-tab active" data-tab="sites" role="tab" aria-selected="true">站点</button>
          <button class="sites-tab" data-tab="announcements" role="tab" aria-selected="false">
            公告<span class="sites-tab-badge" id="unread-badge" hidden>0</span>
          </button>
          <button class="sites-tab" data-tab="models" role="tab" aria-selected="false">模型</button>
        </div>

        <!-- ===================== Sites Tab ===================== -->
        <section id="tab-sites" class="sites-tab-pane active" role="tabpanel">
          <div class="sites-action-bar">
            <div class="sites-action-left">
              <button class="btn btn-primary btn-sm" id="btn-add-site">+ 添加站点</button>
              <button class="btn btn-secondary btn-sm" id="btn-checkin-all">全部签到</button>
              <button class="btn btn-secondary btn-sm" id="btn-refresh-all-balances">刷新余额</button>
            </div>
            <div class="sites-action-right">
              <input type="search" id="site-search" class="sites-search-input" placeholder="搜索站点…" />
            </div>
          </div>
          <div id="site-cards" class="site-card-grid">
            <div class="sites-loading">加载中…</div>
          </div>
          <div id="site-empty" class="sites-empty-state" hidden>
            <div class="sites-empty-icon">📡</div>
            <div class="sites-empty-title">还没有站点</div>
            <div class="sites-empty-desc">添加一个 New API 站点，开始管理账号、签到和渠道投影</div>
            <button class="btn btn-primary" id="btn-add-site-empty">+ 添加站点</button>
          </div>
        </section>

        <!-- ===================== Announcements Tab ===================== -->
        <section id="tab-announcements" class="sites-tab-pane" role="tabpanel" hidden>
          <div class="sites-action-bar">
            <div class="sites-action-left">
              <button class="btn btn-primary btn-sm" id="btn-refresh-announcements">刷新公告</button>
              <button class="btn btn-secondary btn-sm" id="btn-mark-all-read">全部已读</button>
            </div>
            <div class="sites-action-right">
              <label class="sites-checkbox-label">
                <input type="checkbox" id="filter-unread-ann"> 仅未读
              </label>
            </div>
          </div>
          <div id="announcement-list" class="announcement-list">
            <div class="sites-loading">加载中…</div>
          </div>
        </section>

        <!-- ===================== Models Tab ===================== -->
        <section id="tab-models" class="sites-tab-pane" role="tabpanel" hidden>
          <div class="sites-action-bar">
            <div class="sites-action-left">
              <select id="model-account-filter" class="sites-select">
                <option value="">全部账号</option>
              </select>
            </div>
            <div class="sites-action-right">
              <input type="search" id="model-search" class="sites-search-input" placeholder="搜索模型…" />
            </div>
          </div>
          <div id="model-list" class="model-list">
            <div class="sites-loading">加载中…</div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- ===================== Site Modal ===================== -->
  <div id="site-modal" class="sites-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sites-modal-overlay" data-action="close-site-modal"></div>
    <div class="sites-modal-content">
      <div class="sites-modal-header">
        <h2 id="site-modal-title">添加站点</h2>
        <button class="sites-modal-close" data-action="close-site-modal">&times;</button>
      </div>
      <form id="site-form" class="sites-modal-body">
        <input type="hidden" id="site-form-id" />
        <label class="sites-form-row">
          <span class="sites-form-label">名称</span>
          <input type="text" id="site-form-name" required maxlength="191" placeholder="我的站点" />
        </label>
        <label class="sites-form-row">
          <span class="sites-form-label">Base URL</span>
          <input type="url" id="site-form-url" required placeholder="https://api.example.com" />
        </label>
        <label class="sites-form-row">
          <span class="sites-form-label">平台</span>
          <select id="site-form-platform">
            <option value="new-api-family">New API 家族</option>
            <option value="unknown">未知（稍后探测）</option>
          </select>
        </label>
        <label class="sites-form-row">
          <span class="sites-form-label">时区</span>
          <input type="text" id="site-form-timezone" value="Asia/Shanghai" placeholder="Asia/Shanghai" />
        </label>
        <label class="sites-form-row">
          <span class="sites-form-label">代理 URL（可选）</span>
          <input type="url" id="site-form-proxy" placeholder="https://proxy.example.com" />
        </label>
        <label class="sites-form-row sites-form-row-inline">
          <input type="checkbox" id="site-form-enabled" checked />
          <span>启用</span>
        </label>
        <div class="sites-modal-footer">
          <button type="button" class="btn btn-secondary" data-action="close-site-modal">取消</button>
          <button type="submit" class="btn btn-primary" id="site-form-submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== Account Modal ===================== -->
  <div id="account-modal" class="sites-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sites-modal-overlay" data-action="close-account-modal"></div>
    <div class="sites-modal-content">
      <div class="sites-modal-header">
        <h2 id="account-modal-title">添加账号</h2>
        <button class="sites-modal-close" data-action="close-account-modal">&times;</button>
      </div>
      <form id="account-form" class="sites-modal-body">
        <input type="hidden" id="account-form-id" />
        <input type="hidden" id="account-form-site-id" />
        <label class="sites-form-row">
          <span class="sites-form-label">标签</span>
          <input type="text" id="account-form-label" required placeholder="主账号" />
        </label>
        <label class="sites-form-row">
          <span class="sites-form-label">凭证类型</span>
          <select id="account-form-credential-type">
            <option value="access_token">Access Token</option>
            <option value="api_key">API Key</option>
          </select>
        </label>
        <label class="sites-form-row" id="account-credential-input-row">
          <span class="sites-form-label" id="account-credential-label">Access Token</span>
          <input type="password" id="account-form-credential" placeholder="粘贴凭证（仅写入时可见）" />
        </label>
        <p class="sites-form-hint" id="account-credential-hint" hidden>留空则保持原有凭证不变</p>
        <label class="sites-form-row">
          <span class="sites-form-label">时区（可选）</span>
          <input type="text" id="account-form-timezone" placeholder="继承站点时区" />
        </label>
        <div class="sites-form-row-inline-group">
          <label class="sites-form-row-inline">
            <input type="checkbox" id="account-form-enabled" checked />
            <span>启用</span>
          </label>
          <label class="sites-form-row-inline">
            <input type="checkbox" id="account-form-auto-checkin" checked />
            <span>自动签到</span>
          </label>
          <label class="sites-form-row-inline">
            <input type="checkbox" id="account-form-auto-refresh" checked />
            <span>自动刷新</span>
          </label>
        </div>
        <div class="sites-modal-footer">
          <button type="button" class="btn btn-secondary" data-action="close-account-modal">取消</button>
          <button type="submit" class="btn btn-primary" id="account-form-submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== Announcement Detail Modal ===================== -->
  <div id="announcement-modal" class="sites-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sites-modal-overlay" data-action="close-announcement-modal"></div>
    <div class="sites-modal-content sites-modal-content-wide">
      <div class="sites-modal-header">
        <h2 id="announcement-modal-title">公告</h2>
        <button class="sites-modal-close" data-action="close-announcement-modal">&times;</button>
      </div>
      <div class="sites-modal-body" id="announcement-modal-body"></div>
    </div>
  </div>

  <!-- ===================== Projection Modal ===================== -->
  <div id="projection-modal" class="sites-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sites-modal-overlay" data-action="close-projection-modal"></div>
    <div class="sites-modal-content">
      <div class="sites-modal-header">
        <h2>投影到 CCLoad 渠道</h2>
        <button class="sites-modal-close" data-action="close-projection-modal">&times;</button>
      </div>
      <form id="projection-form" class="sites-modal-body">
        <input type="hidden" id="projection-account-id" />
        <label class="sites-form-row">
          <span class="sites-form-label">投影标识</span>
          <input type="text" id="projection-key" value="default" required />
        </label>
        <label class="sites-form-row">
          <span class="sites-form-label">渠道名称（可选）</span>
          <input type="text" id="projection-name" placeholder="自动生成稳定名称" />
        </label>
        <label class="sites-form-row">
          <span class="sites-form-label">API Key（可选）</span>
          <input type="password" id="projection-api-key" placeholder="API Key 账号可留空使用已保存凭证" />
        </label>
        <label class="sites-form-row-inline">
          <input type="checkbox" id="projection-force" />
          <span>确认处理投影冲突</span>
        </label>
        <div class="sites-modal-footer">
          <button type="button" class="btn btn-secondary" data-action="close-projection-modal">取消</button>
          <button type="submit" class="btn btn-primary">生成 / 同步渠道</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== Activity Detail Modal ===================== -->
  <div id="activity-modal" class="sites-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sites-modal-overlay" data-action="close-activity-modal"></div>
    <div class="sites-modal-content sites-modal-content-wide">
      <div class="sites-modal-header">
        <h2 id="activity-modal-title">运行记录</h2>
        <button class="sites-modal-close" data-action="close-activity-modal">&times;</button>
      </div>
      <div class="sites-modal-body" id="activity-modal-body"></div>
    </div>
  </div>

  <!-- ===================== Toast ===================== -->
  <div id="sites-toast" class="sites-toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
