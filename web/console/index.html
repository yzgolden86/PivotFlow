    <script>
      (() => {
        try {
          const preference = localStorage.getItem('fusion_theme')
          const dark = preference === 'dark' ||
            (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (_) {}
      })()
    </script>
