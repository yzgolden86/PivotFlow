<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title>登录 - PivotFlow</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/login.js?v=__VERSION__"></script>
</head>
<body class="fusion-login">
  <div class="login-background"></div>

  <div class="login-page">
    <section class="login-visual" aria-label="枢衡路由拓扑">
      <div class="login-visual-brand">
        <img class="logo-icon" src="/web/brand-mark.svg" alt="">
        <strong class="login-brand-name">枢衡</strong>
      </div>
      <div class="route-canvas" aria-hidden="true">
        <span class="route-link route-link--north"></span>
        <span class="route-link route-link--east"></span>
        <span class="route-link route-link--south"></span>
        <span class="route-link route-link--west"></span>
        <div class="route-core"><img src="/web/brand-mark.svg" alt=""></div>
        <div class="route-node route-node--claude"><i>C</i><span>Claude</span></div>
        <div class="route-node route-node--openai"><i>O</i><span>OpenAI</span></div>
        <div class="route-node route-node--gemini"><i>G</i><span>Gemini</span></div>
        <div class="route-node route-node--codex"><i>X</i><span>Codex</span></div>
        <div class="route-pulse route-pulse--one"></div>
        <div class="route-pulse route-pulse--two"></div>
        <div class="route-pulse route-pulse--three"></div>
      </div>
    </section>

    <div class="login-container animate-slide-up">
      <!-- 登录表单 -->
      <div class="login-form-container">
        <div class="login-header">
          <h2 id="login-title" data-i18n="login.adminLogin">管理员登录</h2>
        </div>

        <div class="login-mode-tabs" role="tablist" aria-label="登录方式">
          <button type="button" class="login-mode-tab active" data-login-mode="admin" role="tab" aria-selected="true">管理员密码</button>
          <button type="button" class="login-mode-tab" data-login-mode="api_token" role="tab" aria-selected="false">API Token</button>
        </div>

        <div id="error-message" class="error-notification hidden">
          <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.864-.833-2.634 0L4.18 16.5c-.77.833.192 2.5 1.732 2.5z"/>
          </svg>
          <span id="error-text"></span>
        </div>

        <form id="login-form" class="login-form">
          <div id="admin-credential-group" class="form-group">
            <label for="password" class="form-label">
              <span>管理密码</span>
            </label>
            <div class="input-container">
              <input type="password" id="password" name="password" class="form-input" required autofocus autocomplete="current-password" placeholder="输入管理密码" />
              <div class="input-decoration"></div>
            </div>
          </div>

          <div id="api-token-credential-group" class="form-group hidden">
            <label for="api-token" class="form-label">
              <span>API Token</span>
            </label>
            <div class="input-container">
              <input type="password" id="api-token" name="api-token" class="form-input" autocomplete="off" placeholder="输入 API Token" />
              <div class="input-decoration"></div>
            </div>
          </div>

          <button type="submit" class="login-button" id="login-button">
            <span class="button-content">
              <svg class="button-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
              </svg>
              <span class="button-text">进入控制台</span>
            </span>
            <div class="button-loader">
              <div class="spinner"></div>
            </div>
          </button>
        </form>

      </div>
    </div>

    <div class="features-showcase animate-slide-up animate-delay-2" hidden>
      <h3 data-i18n="login.featuresTitle">系统特性</h3>
      <div class="features-grid">
        <div class="feature-item">
          <div class="feature-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div class="feature-content">
            <h4 data-i18n="login.feature1Title">智能路由</h4>
            <p data-i18n="login.feature1Desc">基于负载均衡的智能请求分发</p>
          </div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <div class="feature-content">
            <h4 data-i18n="login.feature2Title">故障切换</h4>
            <p data-i18n="login.feature2Desc">自动检测并切换到可用节点</p>
          </div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
          </div>
          <div class="feature-content">
            <h4 data-i18n="login.feature3Title">实时监控</h4>
            <p data-i18n="login.feature3Desc">详细的请求统计和性能分析</p>
          </div>
        </div>
      </div>
    </div>
  </div>


</body>
</html>
